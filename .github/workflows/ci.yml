name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    name: SPDX, Maven SPI & Sandbox Plugin Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check SPDX license headers
        run: npm run check:spdx

      - name: Build and verify all 8 official plugins
        run: bash scripts/build-all.sh

      - name: Upload built plugin bundles
        uses: actions/upload-artifact@v4
        with:
          name: official-plugin-bundles
          path: |
            dist/*.zip
            dist/catalog.json
            dist/SHA256SUMS
